# Local development only. Activate with spring.profiles.active=dev
# (e.g. an IntelliJ run configuration, or SPRING_PROFILES_ACTIVE=dev).

# Refresh-token cookie over plain HTTP localhost - never set this to false
# in a profile that serves real traffic.
app.cookie.secure=false

# Development database (Supabase). Credentials still come from the environment
# (DB_USER / DB_PASSWORD / DB_URL, see .env.example); this file only tunes the
# pool for the Supabase session pooler, which has a small connection budget
# shared by everyone pointing at the same dev project.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Recycle connections before the pooler drops them on its side.
spring.datasource.hikari.max-lifetime=600000
