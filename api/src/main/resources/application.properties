spring.application.name=api
# src/main/resources/application.properties

server.port=${PORT:8080}
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/obd}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-minutes=15
app.jwt.refresh-ttl-days=14

app.invite.code-ttl-hours=${INVITE_CODE_TTL_HOURS:24}
app.invite.join-url-base=${INVITE_JOIN_URL_BASE:http://localhost:5173/join}

app.mail.provider=${MAIL_PROVIDER:log}
app.mail.from=${MAIL_FROM:no-reply@localhost}

app.mail.resend.api-key=${RESEND_API_KEY:}
app.mail.resend.timeout-seconds=${MAIL_TIMEOUT_SECONDS:10}
app.mail.from-name=${MAIL_FROM_NAME:OBD-C}

app.mail.verify-url-base=${MAIL_VERIFY_URL_BASE:http://localhost:5173/verify-email}
app.mail.reset-url-base=${MAIL_RESET_URL_BASE:http://localhost:5173/reset-password}

app.mail.verification-ttl-hours=${MAIL_VERIFICATION_TTL_HOURS:24}
app.mail.reset-ttl-minutes=${MAIL_RESET_TTL_MINUTES:30}
app.mail.resend-throttle-seconds=${MAIL_RESEND_THROTTLE_SECONDS:60}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# app.cookie.secure has no default here - RefreshCookie defaults to `true`
# (HTTPS-only cookies) when unset, which is the safe choice for prod.
# Local HTTP development overrides it to `false` in application-dev.properties.

# Prod-safe error responses: never leak exception messages/stack traces to
# clients. GlobalExceptionHandler covers the known cases; anything else falls
# back to this generic response.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never