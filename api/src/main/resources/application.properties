spring.application.name=api
# src/main/resources/application.properties

# UserRepository is still an in-memory mock, not a real JPA repository.
# Postgres isn't running yet, so DataSource/JPA autoconfig is disabled to let
# the app boot without a live DB connection. Remove this line once
# UserRepository is backed by Spring Data JPA and Postgres is reachable.
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

spring.datasource.url=jdbc:postgresql://localhost:5432/myapp
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-minutes=15
app.jwt.refresh-ttl-days=14

# Comma-separated list of allowed CORS origins. Override per environment
# (e.g. via CORS_ORIGINS env var) rather than editing this default.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# app.cookie.secure has no default here - RefreshCookie defaults to `true`
# (HTTPS-only cookies) when unset, which is the safe choice for prod.
# Local HTTP development overrides it to `false` in application-dev.properties.

# Prod-safe error responses: never leak exception messages/stack traces to
# clients. GlobalExceptionHandler covers the known cases; anything else falls
# back to this generic response.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never